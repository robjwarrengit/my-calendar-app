<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="my-family-calendar" />
  <title>The Warren Family · my-family-calendar</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #F8FAFC;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
    }
    .smooth-scroll {
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Sticky Top Dashboard Header -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-3">
    <div class="max-w-[1680px] mx-auto flex flex-wrap items-center justify-between gap-4">
      <!-- Top-Left Calendar Title Only -->
      <div class="flex items-center">
        <h1 class="text-2xl sm:text-[28px] font-extrabold tracking-tight text-slate-900 leading-tight">The Warren Family</h1>
      </div>

      <!-- Top-Right Date/Time + Weather Only -->
      <div class="flex items-center gap-4">
        <div class="text-right">
          <div id="liveClock" class="text-2xl sm:text-[26px] font-extrabold tracking-tight text-slate-900 leading-none">20:15</div>
          <div id="liveDateLine" class="text-sm font-semibold text-slate-600 mt-1">Friday 27 Nov</div>
        </div>

        <div class="flex items-center gap-2.5 bg-amber-50/80 border border-amber-200/80 rounded-2xl px-3.5 py-2">
          <span class="text-xl leading-none">☀️</span>
          <div>
            <div class="text-sm font-extrabold text-slate-900 leading-tight">22°C</div>
            <div class="text-xs text-slate-500 leading-tight">Sunny &amp; Breezy</div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Body with Left Rail + Main Workspace -->
  <div class="flex-1 flex max-w-[1680px] w-full mx-auto min-h-0">
    <!-- Left Vertical Navigation Rail -->
    <aside class="w-24 sm:w-28 shrink-0 border-r border-slate-200/80 bg-white/85 p-2.5 flex flex-col justify-between">
      <div class="flex flex-col gap-1.5">
        <button id="navSchedule" onclick="setActiveSection('schedule')" class="flex flex-col items-center justify-center gap-1 py-3 px-2 rounded-2xl bg-sky-50 text-sky-700 border border-sky-200/80 transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span class="text-xs font-bold">Schedule</span>
        </button>

        <button id="navTodo" onclick="setActiveSection('todo')" class="relative flex flex-col items-center justify-center gap-1 py-3 px-2 rounded-2xl text-slate-600 hover:bg-slate-100 transition">
          <span id="todoBadge" class="absolute top-2 right-3 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center">0</span>
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4"></polyline>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
          <span class="text-xs font-semibold">To-Do</span>
        </button>

        <button id="navPlans" onclick="setActiveSection('plans')" class="flex flex-col items-center justify-center gap-1 py-3 px-2 rounded-2xl text-slate-600 hover:bg-slate-100 transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
            <line x1="6" y1="1" x2="6" y2="4"></line>
            <line x1="10" y1="1" x2="10" y2="4"></line>
            <line x1="14" y1="1" x2="14" y2="4"></line>
          </svg>
          <span class="text-xs font-semibold">Plans</span>
        </button>

        <button id="navSettings" onclick="setActiveSection('settings')" class="flex flex-col items-center justify-center gap-1 py-3 px-2 rounded-2xl text-slate-600 hover:bg-slate-100 transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span class="text-xs font-semibold text-center leading-tight">Settings &amp; Sync</span>
        </button>
      </div>

      <!-- Sync Button + Sync Time in Left Menu -->
      <div class="mt-4 flex flex-col items-center gap-1.5">
        <button onclick="refreshEvents(true)" class="w-full flex flex-col items-center justify-center gap-1 py-2.5 px-2 rounded-2xl bg-slate-50 text-slate-700 border border-slate-200/90 hover:bg-slate-100 active:scale-[0.99] transition">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span class="text-xs font-bold">Sync</span>
        </button>
        <div id="syncMeta" class="text-[11px] font-medium text-slate-400 text-center leading-tight px-1">Connecting…</div>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="mainContent" class="flex-1 p-4 flex flex-col gap-3 min-w-0"></main>
  </div>

  <script>
    const MEMBERS = [
      {
        id: "family",
        name: "Family",
        badge: "F",
        dot: "bg-blue-500",
        pill: "bg-blue-50 border-blue-200 text-blue-900",
        card: "bg-blue-50 border-blue-200 text-blue-950",
        badgeBg: "bg-blue-600 text-white"
      },
      {
        id: "nat",
        name: "Nat",
        badge: "N",
        dot: "bg-emerald-500",
        pill: "bg-emerald-50 border-emerald-200 text-emerald-900",
        card: "bg-emerald-50 border-emerald-200 text-emerald-950",
        badgeBg: "bg-emerald-600 text-white"
      },
      {
        id: "rob",
        name: "Rob",
        badge: "R",
        dot: "bg-rose-500",
        pill: "bg-rose-50 border-rose-200 text-rose-900",
        card: "bg-rose-50 border-rose-200 text-rose-950",
        badgeBg: "bg-rose-600 text-white"
      },
      {
        id: "hamish",
        name: "Hamish",
        badge: "H",
        dot: "bg-teal-500",
        pill: "bg-teal-50 border-teal-200 text-teal-900",
        card: "bg-teal-50 border-teal-200 text-teal-950",
        badgeBg: "bg-teal-600 text-white"
      },
      {
        id: "seb",
        name: "Seb",
        badge: "S",
        dot: "bg-amber-400",
        pill: "bg-amber-50 border-amber-300 text-amber-950",
        card: "bg-amber-100/90 border-amber-300 text-amber-950",
        badgeBg: "bg-amber-400 text-amber-950"
      }
    ];

    const DEFAULT_ROUTINE = [
      { id: "r1", icon: "🥣", label: "Eat brekkie", hamish: false, seb: false },
      { id: "r2", icon: "🪥", label: "Clean teeth", hamish: false, seb: false },
      { id: "r3", icon: "👔", label: "Get dressed", hamish: false, seb: false },
      { id: "r4", icon: "🎒", label: "Pack bag", hamish: false, seb: false },
      { id: "r5", icon: "👟", label: "Shoes on", hamish: false, seb: false }
    ];

    const STORAGE_KEY = "my_family_calendar_state_v7";
    const FALLBACK_EVENTS = buildSampleEvents();

    let state = loadState();
    let activeSection = "schedule";
    let viewMode = "grid"; // "grid" | "list"
    let stepDays = 7; // 7 (week-by-week) or 1
    let editingRoutine = false;
    let scrollRoutineIntoView = false;
    let liveEvents = [];
    let feedStatuses = [];
    let usingFallback = true;
    let lastErrorMessage = "";

    function getMondayWeekOffset() {
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      const day = now.getDay();
      return day === 0 ? -6 : 1 - day;
    }

    function loadState() {
      const defaultMondayOffset = getMondayWeekOffset();
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const p = JSON.parse(raw);
          return {
            startOffsetDays: typeof p.startOffsetDays === "number" ? p.startOffsetDays : defaultMondayOffset,
            showWeekend: Boolean(p.showWeekend),
            showMorningRoutine: Boolean(p.showMorningRoutine),
            selectedMembers: Array.isArray(p.selectedMembers) && p.selectedMembers.length
              ? p.selectedMembers
              : MEMBERS.map((m) => m.id),
            officeFlags: p.officeFlags || {},
            routine: Array.isArray(p.routine) && p.routine.length ? p.routine : structuredClone(DEFAULT_ROUTINE),
            todos: Array.isArray(p.todos) ? p.todos : [
              { id: "t1", text: "Check school excursion note for Hamish & Seb", done: false },
              { id: "t2", text: "Restock fruit & lunchbox snacks", done: false },
              { id: "t3", text: "Order weekend groceries", done: true }
            ],
            plans: Array.isArray(p.plans) ? p.plans : [
              { id: "p1", title: "Saturday Beach / Park Morning", notes: "Pack hats, sunscreen & towels" }
            ],
            privacy: {
              stripNotes: p.privacy?.stripNotes !== false,
              hideLocation: Boolean(p.privacy?.hideLocation)
            }
          };
        }
      } catch (_) {}

      return {
        startOffsetDays: defaultMondayOffset,
        showWeekend: false,
        showMorningRoutine: false,
        selectedMembers: MEMBERS.map((m) => m.id),
        officeFlags: {},
        routine: structuredClone(DEFAULT_ROUTINE),
        todos: [
          { id: "t1", text: "Check school excursion note for Hamish & Seb", done: false },
          { id: "t2", text: "Restock fruit & lunchbox snacks", done: false },
          { id: "t3", text: "Order weekend groceries", done: true }
        ],
        plans: [
          { id: "p1", title: "Saturday Beach / Park Morning", notes: "Pack hats, sunscreen & towels" }
        ],
        privacy: {
          stripNotes: true,
          hideLocation: false
        }
      };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (_) {}
    }

    function buildSampleEvents() {
      const monday = new Date();
      monday.setHours(0, 0, 0, 0);
      monday.setDate(monday.getDate() + getMondayWeekOffset());

      const mkTimed = (dayIdx, sh, sm, eh, em, memberId, title) => {
        const s = new Date(monday);
        s.setDate(monday.getDate() + dayIdx);
        s.setHours(sh, sm, 0, 0);
        const e = new Date(monday);
        e.setDate(monday.getDate() + dayIdx);
        e.setHours(eh, em, 0, 0);
        return { id: `t-${dayIdx}-${sh}-${memberId}-${title}`, memberId, title, start: s.toISOString(), end: e.toISOString(), allDay: false, location: "", notes: "" };
      };

      const mkAllDay = (dayIdx, memberId, title) => {
        const s = new Date(monday);
        s.setDate(monday.getDate() + dayIdx);
        s.setHours(0, 0, 0, 0);
        const e = new Date(monday);
        e.setDate(monday.getDate() + dayIdx);
        e.setHours(23, 59, 59, 999);
        return { id: `a-${dayIdx}-${memberId}-${title}`, memberId, title, start: s.toISOString(), end: e.toISOString(), allDay: true, location: "", notes: "" };
      };

      return [
        mkAllDay(0, "family", "Library Book Due"),
        mkAllDay(2, "hamish", "School Sports Carnival"),
        mkTimed(0, 8, 30, 9, 15, "nat", "School drop-off"),
        mkTimed(0, 9, 0, 11, 30, "rob", "Product roadmap sync"),
        mkTimed(0, 9, 30, 10, 45, "family", "Overlap check"),
        mkTimed(1, 9, 30, 10, 30, "rob", "Client design review"),
        mkTimed(2, 15, 30, 16, 30, "hamish", "Swimming lesson"),
        mkTimed(3, 16, 0, 17, 0, "seb", "Lego & reading time"),
        mkTimed(4, 10, 0, 11, 30, "family", "Friday catch-up")
      ];
    }

    async function loadLiveCalendarEvents(forceRefresh = false) {
      const params = new URLSearchParams({
        stripNotes: state.privacy.stripNotes ? "1" : "0",
        hideLocation: state.privacy.hideLocation ? "1" : "0",
        ...(forceRefresh ? { refresh: "1" } : {})
      });
      const res = await fetch(`/api/calendar/events?${params.toString()}`, {
        redirect: "manual"
      });
      if (res.type === "opaqueredirect" || res.status === 302) {
        throw new Error("Redirected by auth or Worker");
      }
      if (!res.ok) {
        throw new Error(`HTTP ${res.status} from /api/calendar/events`);
      }
      const contentType = res.headers.get("content-type") || "";
      if (!contentType.includes("application/json")) {
        throw new Error("Endpoint did not return JSON");
      }
      return await res.json();
    }

    async function refreshEvents(forceRefresh = false) {
      setSyncText("Syncing…");
      try {
        const data = await loadLiveCalendarEvents(forceRefresh);
        if (Array.isArray(data.events)) {
          liveEvents = data.events;
          feedStatuses = Array.isArray(data.feeds) ? data.feeds : [];
          usingFallback = false;
          lastErrorMessage = "";
          const t = new Date(data.syncedAt || Date.now()).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
          setSyncText(`Synced ${t}`);
        } else {
          throw new Error("Invalid events payload");
        }
      } catch (err) {
        liveEvents = FALLBACK_EVENTS;
        usingFallback = true;
        lastErrorMessage = err?.message || "Failed to load live feeds";
        setSyncText("Sample data");
      }
      render();
    }

    function setSyncText(txt) {
      const el = document.getElementById("syncMeta");
      if (el) el.textContent = txt;
    }

    function updateClock() {
      const now = new Date();
      const clockEl = document.getElementById("liveClock");
      const dateEl = document.getElementById("liveDateLine");
      if (clockEl) clockEl.textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
      if (dateEl) dateEl.textContent = now.toLocaleDateString([], { weekday: "long", day: "numeric", month: "short" });
    }

    function dateKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function isWeekendDate(d) {
      const dow = d.getDay();
      return dow === 0 || dow === 6;
    }

    function getVisibleDays() {
      const start = new Date();
      start.setHours(0, 0, 0, 0);
      start.setDate(start.getDate() + state.startOffsetDays);

      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        if (!state.showWeekend && isWeekendDate(d)) continue;
        days.push(d);
        if (!state.showWeekend && days.length === 5) break;
      }
      return days;
    }

    function getEventsForDay(dayDate) {
      const dayStart = new Date(dayDate.getFullYear(), dayDate.getMonth(), dayDate.getDate(), 0, 0, 0, 0);
      const dayEnd = new Date(dayDate.getFullYear(), dayDate.getMonth(), dayDate.getDate(), 23, 59, 59, 999);

      return liveEvents
        .filter((ev) => {
          if (!state.selectedMembers.includes(ev.memberId)) return false;
          const s = new Date(ev.start);
          const e = new Date(ev.end || ev.start);
          return s <= dayEnd && e >= dayStart;
        })
        .sort((a, b) => {
          if (a.allDay && !b.allDay) return -1;
          if (!a.allDay && b.allDay) return 1;
          return new Date(a.start) - new Date(b.start);
        });
    }

    function layoutTimedEvents(timedEvents) {
      const items = timedEvents.map((ev) => {
        const sMs = new Date(ev.start).getTime();
        const eMs = Math.max(sMs + 15 * 60 * 1000, new Date(ev.end || ev.start).getTime());
        return { ev, sMs, eMs, col: 0, cols: 1 };
      }).sort((a, b) => a.sMs - b.sMs || b.eMs - a.eMs);

      const clusters = [];
      let currentCluster = [];
      let clusterEnd = -Infinity;

      for (const item of items) {
        if (currentCluster.length === 0 || item.sMs < clusterEnd) {
          currentCluster.push(item);
          clusterEnd = Math.max(clusterEnd, item.eMs);
        } else {
          clusters.push(currentCluster);
          currentCluster = [item];
          clusterEnd = item.eMs;
        }
      }
      if (currentCluster.length > 0) clusters.push(currentCluster);

      for (const cluster of clusters) {
        const colEndTimes = [];
        for (const item of cluster) {
          let placedCol = -1;
          for (let c = 0; c < colEndTimes.length; c++) {
            if (colEndTimes[c] <= item.sMs) {
              placedCol = c;
              colEndTimes[c] = item.eMs;
              break;
            }
          }
          if (placedCol === -1) {
            placedCol = colEndTimes.length;
            colEndTimes.push(item.eMs);
          }
          item.col = placedCol;
        }
        const totalCols = Math.max(1, colEndTimes.length);
        for (const item of cluster) {
          item.cols = totalCols;
        }
      }

      return items;
    }

    function getOffice(key) {
      const cur = state.officeFlags[key] || {};
      return {
        nat: cur.nat === "office" ? "office" : "wfh",
        rob: cur.rob === "office" ? "office" : "wfh"
      };
    }

    function toggleOffice(key, person) {
      const cur = getOffice(key);
      state.officeFlags[key] = {
        ...cur,
        [person]: cur[person] === "office" ? "wfh" : "office"
      };
      saveState();
      render();
    }

    function renderOfficeTogglePair(dayDate) {
      if (isWeekendDate(dayDate)) return "";
      const key = dateKey(dayDate);
      const flags = getOffice(key);
      const natOffice = flags.nat === "office";
      const robOffice = flags.rob === "office";

      return `
        <div class="grid grid-cols-2 gap-1.5 mt-2">
          <button onclick="toggleOffice('${key}', 'nat')" title="Switch Nat between Office and WFH" class="h-8 px-2 rounded-xl border text-[11px] font-bold flex items-center justify-center whitespace-nowrap transition ${
            natOffice
              ? "bg-blue-100 border-blue-400 text-blue-950 shadow-2xs"
              : "bg-white border-slate-200 text-slate-600 hover:bg-slate-50"
          }">
            <span>${natOffice ? "Nat Office" : "Nat WFH"}</span>
          </button>

          <button onclick="toggleOffice('${key}', 'rob')" title="Switch Rob between Office and WFH" class="h-8 px-2 rounded-xl border text-[11px] font-bold flex items-center justify-center whitespace-nowrap transition ${
            robOffice
              ? "bg-blue-100 border-blue-400 text-blue-950 shadow-2xs"
              : "bg-white border-slate-200 text-slate-600 hover:bg-slate-50"
          }">
            <span>${robOffice ? "Rob Office" : "Rob WFH"}</span>
          </button>
        </div>
      `;
    }

    function shiftWindow(direction) {
      state.startOffsetDays += direction * stepDays;
      saveState();
      render();
    }

    function goToday() {
      state.startOffsetDays = 0;
      saveState();
      render();
    }

    function setStep(days) {
      stepDays = days;
      render();
    }

    function toggleWeekend() {
      state.showWeekend = !state.showWeekend;
      saveState();
      render();
    }

    function toggleMorningRoutineDrawer() {
      state.showMorningRoutine = !state.showMorningRoutine;
      if (!state.showMorningRoutine) {
        editingRoutine = false;
      } else {
        scrollRoutineIntoView = true;
      }
      saveState();
      render();
    }

    function toggleEditRoutine() {
      editingRoutine = !editingRoutine;
      scrollRoutineIntoView = true;
      render();
    }

    function toggleRoutineCheck(id, child) {
      const row = state.routine.find((r) => r.id === id);
      if (!row) return;
      row[child] = !row[child];
      saveState();
      render();
    }

    function updateRoutineLabel(id, value) {
      const row = state.routine.find((r) => r.id === id);
      if (!row) return;
      row.label = value;
      saveState();
    }

    function updateRoutineIcon(id, value) {
      const row = state.routine.find((r) => r.id === id);
      if (!row) return;
      row.icon = value.trim() || "⭐";
      saveState();
      render();
    }

    function addRoutineTask(e) {
      e.preventDefault();
      const labelEl = document.getElementById("newRoutineLabel");
      const iconEl = document.getElementById("newRoutineIcon");
      const label = (labelEl?.value || "").trim();
      const icon = (iconEl?.value || "").trim() || "⭐";
      if (!label) return;
      state.routine.push({
        id: `r-${Date.now()}`,
        icon,
        label,
        hamish: false,
        seb: false
      });
      scrollRoutineIntoView = true;
      saveState();
      render();
    }

    function removeRoutineTask(id) {
      if (state.routine.length <= 1) return;
      state.routine = state.routine.filter((r) => r.id !== id);
      saveState();
      render();
    }

    function resetRoutineChecks() {
      state.routine = state.routine.map((r) => ({ ...r, hamish: false, seb: false }));
      saveState();
      render();
    }

    function setViewMode(mode) {
      viewMode = mode;
      render();
    }

    function setActiveSection(sec) {
      activeSection = sec;
      const map = { schedule: "navSchedule", todo: "navTodo", plans: "navPlans", settings: "navSettings" };
      Object.entries(map).forEach(([k, id]) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.className = k === sec
          ? "flex flex-col items-center justify-center gap-1 py-3 px-2 rounded-2xl bg-sky-50 text-sky-700 border border-sky-200/80 transition"
          : "flex flex-col items-center justify-center gap-1 py-3 px-2 rounded-2xl text-slate-600 hover:bg-slate-100 transition";
      });
      render();
    }

    function toggleMember(id) {
      if (state.selectedMembers.includes(id)) {
        if (state.selectedMembers.length === 1) return;
        state.selectedMembers = state.selectedMembers.filter((m) => m !== id);
      } else {
        state.selectedMembers.push(id);
      }
      saveState();
      render();
    }

    function selectAllMembers() {
      state.selectedMembers = MEMBERS.map((m) => m.id);
      saveState();
      render();
    }

    function syncBadges() {
      const todoBadge = document.getElementById("todoBadge");
      if (todoBadge) {
        todoBadge.textContent = String(state.todos.filter((t) => !t.done).length);
      }
    }

    function renderFilterAndNavBar() {
      const allSelected = state.selectedMembers.length === MEMBERS.length;

      const allBtn = `
        <button onclick="selectAllMembers()" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full border text-xs font-bold transition ${
          allSelected ? "bg-slate-900 border-slate-900 text-white" : "bg-white border-slate-200 text-slate-600 hover:bg-slate-50"
        }">
          <span>All Family</span>
          <span class="px-1.5 py-0.2 rounded-full text-[10px] ${allSelected ? "bg-white/20 text-white" : "bg-slate-100 text-slate-700"}">${liveEvents.length}</span>
        </button>
      `;

      const memberBtns = MEMBERS.map((m) => {
        const active = state.selectedMembers.includes(m.id);
        const count = liveEvents.filter((e) => e.memberId === m.id).length;
        return `
          <button onclick="toggleMember('${m.id}')" class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full border text-xs font-bold transition ${
            active ? m.pill : "bg-slate-100 border-slate-200 text-slate-400 opacity-65"
          }">
            <span class="w-2 h-2 rounded-full ${m.dot}"></span>
            <span>${m.name}</span>
            <span class="px-1.5 py-0.2 rounded-full bg-white/80 text-slate-700 text-[10px]">${count}</span>
          </button>
        `;
      }).join("");

      const navRight = `
        <div class="flex flex-wrap items-center gap-2">
          <div class="flex items-center bg-slate-100 p-0.5 rounded-xl">
            <button onclick="shiftWindow(-1)" class="w-8 h-8 rounded-lg hover:bg-white font-bold text-slate-700">&lsaquo;</button>
            <button onclick="goToday()" class="px-2.5 h-8 rounded-lg hover:bg-white text-xs font-bold text-slate-800">Today</button>
            <button onclick="shiftWindow(1)" class="w-8 h-8 rounded-lg hover:bg-white font-bold text-slate-700">&rsaquo;</button>
          </div>

          <div class="flex items-center bg-slate-100 p-0.5 rounded-xl">
            <button onclick="setStep(7)" class="px-2.5 h-8 rounded-lg text-xs font-bold transition ${stepDays === 7 ? "bg-white text-slate-900 shadow-2xs" : "text-slate-600"}">7d</button>
            <button onclick="setStep(1)" class="px-2.5 h-8 rounded-lg text-xs font-bold transition ${stepDays === 1 ? "bg-white text-slate-900 shadow-2xs" : "text-slate-600"}">1d</button>
          </div>

          <button onclick="toggleWeekend()" class="h-8 px-3 rounded-xl border text-xs font-bold transition ${
            state.showWeekend ? "bg-sky-50 border-sky-300 text-sky-900" : "bg-white border-slate-200 text-slate-700 hover:bg-slate-50"
          }">
            ${state.showWeekend ? "Weekend: On" : "Weekend: Off"}
          </button>
        </div>
      `;

      return `
        <div class="flex flex-wrap items-center justify-between gap-2 bg-white rounded-2xl border border-slate-200 px-3.5 py-2 shadow-2xs">
          <div class="flex flex-wrap items-center gap-2">
            ${allBtn + memberBtns}
          </div>
          ${navRight}
        </div>
      `;
    }

    function memberObj(id) {
      return MEMBERS.find((m) => m.id === id) || MEMBERS[0];
    }

    function fmtRange(ev) {
      if (ev.allDay) return "All day";
      const opts = { hour: "numeric", minute: "2-digit" };
      return `${new Date(ev.start).toLocaleTimeString([], opts)}–${new Date(ev.end || ev.start).toLocaleTimeString([], opts)}`;
    }

    function renderMorningRoutineDrawer() {
      if (!state.showMorningRoutine) return "";
      return `
        <section id="morningRoutinePanel" class="bg-white rounded-2xl border border-sky-200 p-4 shadow-md flex flex-col gap-3">
          <div class="flex items-center justify-between gap-2">
            <h2 class="text-base font-extrabold text-slate-900">Morning Routine · Hamish &amp; Seb</h2>
            <div class="flex items-center gap-2">
              <button onclick="toggleEditRoutine()" class="px-3 py-1.5 rounded-xl border text-xs font-bold transition ${
                editingRoutine ? "bg-sky-50 border-sky-300 text-sky-800" : "bg-slate-100 border-slate-200 text-slate-700 hover:bg-slate-200"
              }">${editingRoutine ? "Done" : "Edit"}</button>
              <button onclick="resetRoutineChecks()" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700">
                Reset
              </button>
            </div>
          </div>

          ${editingRoutine ? `
            <form onsubmit="addRoutineTask(event)" class="flex flex-wrap sm:flex-nowrap items-center gap-2 bg-slate-50 border border-slate-200/80 rounded-xl p-2.5">
              <input id="newRoutineIcon" type="text" maxlength="4" placeholder="⭐" class="w-14 rounded-lg border border-slate-300 bg-white px-2.5 py-1.5 text-sm text-center" />
              <input id="newRoutineLabel" type="text" placeholder="New morning task for Hamish & Seb…" class="flex-1 rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm" />
              <button class="px-3.5 py-1.5 rounded-lg bg-sky-600 text-white text-xs font-bold hover:bg-sky-700">Add Task</button>
            </form>
          ` : ""}

          <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
            ${state.routine.map((r) => `
              <div class="flex items-center justify-between gap-2 rounded-2xl border border-slate-200/80 bg-slate-50/60 px-3.5 py-2.5">
                ${editingRoutine ? `
                  <div class="flex items-center gap-2 flex-1 min-w-0">
                    <input type="text" value="${esc(r.icon || "⭐")}" onchange="updateRoutineIcon('${r.id}', this.value)" class="w-11 rounded-lg border border-slate-300 bg-white px-1.5 py-1 text-sm text-center shrink-0" />
                    <input type="text" value="${esc(r.label)}" onchange="updateRoutineLabel('${r.id}', this.value)" class="flex-1 min-w-0 rounded-lg border border-slate-300 bg-white px-2.5 py-1 text-xs font-bold text-slate-800" />
                    <button onclick="removeRoutineTask('${r.id}')" title="Delete task" class="px-2 py-1 rounded-lg text-xs font-bold text-rose-600 hover:bg-rose-50 shrink-0">✕</button>
                  </div>
                ` : `
                  <div class="flex items-center gap-2.5 min-w-0">
                    <span class="text-base shrink-0">${esc(r.icon || "⭐")}</span>
                    <span class="text-xs font-bold text-slate-800 whitespace-normal break-words leading-snug">${esc(r.label)}</span>
                  </div>
                  <div class="flex items-center gap-1.5 shrink-0">
                    <button onclick="toggleRoutineCheck('${r.id}', 'hamish')" class="px-2.5 py-1 rounded-xl border text-[11px] font-bold transition ${
                      r.hamish
                        ? "bg-teal-100 border-teal-300 text-teal-950 line-through"
                        : "bg-white border-teal-200 text-teal-800"
                    }">${r.hamish ? "✓ Hamish" : "Hamish"}</button>
                    <button onclick="toggleRoutineCheck('${r.id}', 'seb')" class="px-2.5 py-1 rounded-xl border text-[11px] font-bold transition ${
                      r.seb
                        ? "bg-amber-200 border-amber-400 text-amber-950 line-through"
                        : "bg-white border-amber-300 text-amber-900"
                    }">${r.seb ? "✓ Seb" : "Seb"}</button>
                  </div>
                `}
              </div>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderSchedule() {
      const days = getVisibleDays();
      const todayKey = dateKey(new Date());
      const colCount = days.length;

      let calendarBody = "";

      if (viewMode === "list") {
        calendarBody = `
          <div class="smooth-scroll overflow-auto flex-1 min-h-[380px] max-h-[calc(100vh-235px)] rounded-2xl">
            <div class="grid gap-3 min-h-[540px]" style="grid-template-columns: repeat(${colCount}, minmax(210px, 1fr))">
              ${days.map((d) => {
                const k = dateKey(d);
                const isToday = k === todayKey;
                const events = getEventsForDay(d);
                return `
                  <section class="bg-white rounded-2xl border ${isToday ? "border-sky-400" : "border-slate-200"} flex flex-col min-h-[540px] shadow-2xs">
                    <div class="sticky top-0 z-20 bg-white/95 backdrop-blur rounded-t-2xl p-3 border-b border-slate-100">
                      <div class="flex items-center gap-2 flex-wrap">
                        <span class="text-base sm:text-lg font-extrabold text-slate-900 leading-tight">${d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" })}</span>
                        ${isToday ? '<span class="px-1.5 py-0.5 rounded bg-sky-100 text-sky-700 text-[10px] font-extrabold uppercase">Today</span>' : ""}
                      </div>
                      ${renderOfficeTogglePair(d)}
                    </div>

                    <div class="p-2.5 flex flex-col gap-2 flex-1">
                      ${events.length === 0
                        ? '<div class="flex-1 rounded-xl border border-dashed border-slate-200/80 flex items-center justify-center text-xs text-slate-400">No events scheduled</div>'
                        : events.map((ev) => {
                            const m = memberObj(ev.memberId);
                            return `
                              <div class="rounded-xl border p-2.5 ${m.card}">
                                <div class="flex items-start justify-between gap-1.5">
                                  <span class="text-xs font-extrabold whitespace-normal break-words leading-snug">${esc(ev.title)}</span>
                                  <span class="w-5 h-5 rounded-full text-[10px] font-extrabold flex items-center justify-center shrink-0 ${m.badgeBg}">${m.badge}</span>
                                </div>
                                <div class="text-[11px] opacity-85 mt-1 whitespace-normal break-words leading-snug">${fmtRange(ev)}</div>
                              </div>
                            `;
                          }).join("")}
                    </div>
                  </section>
                `;
              }).join("")}
            </div>
          </div>
        `;
      } else {
        const startHour = 8;
        const endHour = 20;
        const hourH = 62;
        const gridH = (endHour - startHour) * hourH;
        const hours = Array.from({ length: endHour - startHour + 1 }, (_, i) => startHour + i);

        calendarBody = `
          <div class="smooth-scroll bg-white rounded-2xl border border-slate-200 shadow-2xs overflow-auto flex-1 min-h-[380px] max-h-[calc(100vh-235px)]">
            <div class="min-w-[820px]">
              <!-- Sticky Day + Office/WFH Header Row inside scroll pane -->
              <div class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-slate-200 px-3 pt-2.5 pb-2 grid gap-2" style="grid-template-columns: 60px repeat(${colCount}, minmax(0, 1fr))">
                <div class="text-[10px] font-bold uppercase text-slate-400 self-end pb-1">Time</div>
                ${days.map((d) => {
                  const isToday = dateKey(d) === todayKey;
                  return `
                    <div class="px-1">
                      <div class="flex items-center gap-2 flex-wrap">
                        <span class="text-base sm:text-lg font-extrabold text-slate-900 leading-tight">${d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" })}</span>
                        ${isToday ? '<span class="px-1.5 py-0.5 rounded bg-sky-100 text-sky-700 text-[10px] font-extrabold uppercase">Today</span>' : ""}
                      </div>
                      ${renderOfficeTogglePair(d)}
                    </div>
                  `;
                }).join("")}
              </div>

              <!-- All-Day Strip -->
              <div class="border-b border-slate-200 bg-slate-50/70 px-3 py-1.5 grid gap-2 items-start" style="grid-template-columns: 60px repeat(${colCount}, minmax(0, 1fr))">
                <div class="text-[10px] font-bold uppercase text-slate-400 pt-1">All Day</div>
                ${days.map((d) => {
                  const allDayEvs = getEventsForDay(d).filter((e) => e.allDay);
                  return `
                    <div class="flex flex-col gap-1 min-h-[26px] px-1">
                      ${allDayEvs.map((ev) => {
                        const m = memberObj(ev.memberId);
                        return `
                          <div class="rounded-lg border px-2 py-1 text-[11px] font-bold flex items-start justify-between gap-1 ${m.card}">
                            <span class="whitespace-normal break-words leading-snug">${esc(ev.title)}</span>
                            <span class="w-4 h-4 rounded-full text-[9px] font-extrabold flex items-center justify-center shrink-0 mt-0.5 ${m.badgeBg}">${m.badge}</span>
                          </div>
                        `;
                      }).join("")}
                    </div>
                  `;
                }).join("")}
              </div>

              <!-- Timed Hourly Grid (8 AM – 8 PM) -->
              <div class="px-3 py-2 grid gap-2" style="grid-template-columns: 60px repeat(${colCount}, minmax(0, 1fr))">
                <div class="relative" style="height:${gridH}px">
                  ${hours.map((h) => {
                    const top = (h - startHour) * hourH;
                    const lbl = new Date(2026, 0, 1, h, 0).toLocaleTimeString([], { hour: "numeric" });
                    return `<div style="top:${top - 7}px" class="absolute right-2 text-[11px] font-medium text-slate-400">${lbl}</div>`;
                  }).join("")}
                </div>

                ${days.map((d) => {
                  const timed = getEventsForDay(d).filter((e) => !e.allDay);
                  const laidOut = layoutTimedEvents(timed);
                  return `
                    <div class="relative rounded-xl bg-slate-50/50 border border-slate-200/70" style="height:${gridH}px">
                      ${hours.map((h) => `<div style="top:${(h - startHour) * hourH}px" class="absolute inset-x-0 border-t border-slate-200/70"></div>`).join("")}
                      ${laidOut.map(({ ev, col, cols }) => {
                        const m = memberObj(ev.memberId);
                        const s = new Date(ev.start);
                        const e = new Date(ev.end || ev.start);
                        const sDec = Math.max(startHour, s.getHours() + s.getMinutes() / 60);
                        const eDec = Math.min(endHour, Math.max(sDec + 0.5, e.getHours() + e.getMinutes() / 60));
                        const topPx = (sDec - startHour) * hourH;
                        const minH = Math.max(36, (eDec - sDec) * hourH);
                        const widthPct = 100 / cols;
                        const leftPct = col * widthPct;

                        return `
                          <div style="top:${topPx}px;min-height:${minH}px;left:calc(${leftPct}% + 3px);width:calc(${widthPct}% - 6px)" class="absolute z-10 hover:z-20 rounded-xl border px-2 py-1.5 ${m.card} shadow-2xs">
                            <div class="flex items-start justify-between gap-1">
                              <div class="min-w-0 flex-1">
                                <div class="text-xs font-extrabold whitespace-normal break-words leading-snug">${esc(ev.title)}</div>
                                <div class="text-[11px] opacity-85 whitespace-normal break-words leading-snug mt-0.5">${fmtRange(ev)}</div>
                              </div>
                              <span class="w-4 h-4 rounded-full text-[9px] font-extrabold flex items-center justify-center shrink-0 mt-0.5 ${m.badgeBg}">${m.badge}</span>
                            </div>
                          </div>
                        `;
                      }).join("")}
                    </div>
                  `;
                }).join("")}
              </div>
            </div>
          </div>
        `;
      }

      const bottomToolbar = `
        <div class="sticky bottom-0 z-20 flex flex-wrap items-center justify-between gap-2 bg-white/95 backdrop-blur rounded-2xl border border-slate-200 px-3.5 py-2.5 shadow-xs">
          <div class="flex items-center bg-slate-100 p-0.5 rounded-xl">
            <button onclick="setViewMode('list')" class="px-3.5 h-8 rounded-lg text-xs font-bold transition ${viewMode === "list" ? "bg-sky-100 text-sky-950 shadow-2xs" : "text-slate-700"}">List Cards</button>
            <button onclick="setViewMode('grid')" class="px-3.5 h-8 rounded-lg text-xs font-bold transition ${viewMode === "grid" ? "bg-sky-100 text-sky-950 shadow-2xs" : "text-slate-700"}">Time Grid</button>
          </div>

          <button onclick="toggleMorningRoutineDrawer()" class="flex items-center gap-2 h-8 px-3.5 rounded-xl border text-xs font-bold transition ${
            state.showMorningRoutine ? "bg-sky-50 border-sky-300 text-sky-900" : "bg-white border-slate-200 text-slate-700"
          }">
            <span>Morning Routine</span>
            <span class="w-7 h-4 rounded-full p-0.5 flex items-center transition ${state.showMorningRoutine ? "bg-sky-500 justify-end" : "bg-slate-300 justify-start"}">
              <span class="w-3 h-3 rounded-full bg-white block"></span>
            </span>
          </button>
        </div>
      `;

      document.getElementById("mainContent").innerHTML =
        renderFilterAndNavBar() +
        calendarBody +
        renderMorningRoutineDrawer() +
        bottomToolbar;

      if (scrollRoutineIntoView && state.showMorningRoutine) {
        scrollRoutineIntoView = false;
        requestAnimationFrame(() => {
          document.getElementById("morningRoutinePanel")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
        });
      }
    }

    function renderTodo() {
      document.getElementById("mainContent").innerHTML = `
        <section class="bg-white rounded-2xl border border-slate-200 p-5 shadow-2xs flex flex-col gap-4">
          <h2 class="text-base font-extrabold text-slate-900">To-Do</h2>
          <form onsubmit="addTodo(event)" class="flex gap-2">
            <input id="todoInput" type="text" placeholder="Add task…" class="flex-1 rounded-xl border border-slate-300 px-3 py-2 text-sm" />
            <button class="px-4 py-2 rounded-xl bg-sky-600 text-white text-xs font-bold">Add</button>
          </form>
          <ul class="divide-y divide-slate-100">
            ${state.todos.map((t) => `
              <li class="py-2.5 flex items-center justify-between gap-3">
                <button onclick="toggleTodo('${t.id}')" class="flex items-center gap-2.5 text-left flex-1">
                  <span class="w-5 h-5 rounded-md border flex items-center justify-center text-xs font-bold ${t.done ? "bg-sky-600 border-sky-600 text-white" : "border-slate-300"}">${t.done ? "✓" : ""}</span>
                  <span class="text-sm ${t.done ? "line-through text-slate-400" : "text-slate-800"}">${esc(t.text)}</span>
                </button>
                <button onclick="delTodo('${t.id}')" class="text-xs text-slate-400 hover:text-rose-600">Remove</button>
              </li>
            `).join("")}
          </ul>
        </section>
      `;
    }

    function addTodo(e) {
      e.preventDefault();
      const v = (document.getElementById("todoInput")?.value || "").trim();
      if (!v) return;
      state.todos.unshift({ id: String(Date.now()), text: v, done: false });
      saveState();
      render();
    }

    function toggleTodo(id) {
      const it = state.todos.find((t) => t.id === id);
      if (!it) return;
      it.done = !it.done;
      saveState();
      render();
    }

    function delTodo(id) {
      state.todos = state.todos.filter((t) => t.id !== id);
      saveState();
      render();
    }

    function renderPlans() {
      document.getElementById("mainContent").innerHTML = `
        <section class="bg-white rounded-2xl border border-slate-200 p-5 shadow-2xs flex flex-col gap-4">
          <h2 class="text-base font-extrabold text-slate-900">Plans</h2>
          <form onsubmit="addPlan(event)" class="grid grid-cols-1 md:grid-cols-3 gap-2">
            <input id="planTitle" type="text" placeholder="Plan title…" class="rounded-xl border border-slate-300 px-3 py-2 text-sm" />
            <input id="planNotes" type="text" placeholder="Details…" class="rounded-xl border border-slate-300 px-3 py-2 text-sm" />
            <button class="px-4 py-2 rounded-xl bg-sky-600 text-white text-xs font-bold">Add Plan</button>
          </form>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            ${state.plans.map((p) => `
              <div class="rounded-xl border border-slate-200 p-3.5 flex items-start justify-between gap-2">
                <div>
                  <div class="text-sm font-extrabold text-slate-900">${esc(p.title)}</div>
                  <div class="text-xs text-slate-500 mt-0.5">${esc(p.notes || "")}</div>
                </div>
                <button onclick="delPlan('${p.id}')" class="text-xs text-slate-400 hover:text-rose-600">Remove</button>
              </div>
            `).join("")}
          </div>
        </section>
      `;

    function addPlan(e) {
      e.preventDefault();
      const title = (document.getElementById("planTitle")?.value || "").trim();
      const notes = (document.getElementById("planNotes")?.value || "").trim();
      if (!title) return;
      state.plans.unshift({ id: String(Date.now()), title, notes });
      saveState();
      render();
    }

    function delPlan(id) {
      state.plans = state.plans.filter((p) => p.id !== id);
      saveState();
      render();
    }

    function renderSettings() {
      document.getElementById("mainContent").innerHTML = `
        <section class="bg-white rounded-2xl border border-slate-200 p-5 shadow-2xs flex flex-col gap-4">
          <div>
            <h2 class="text-base font-extrabold text-slate-900">Settings &amp; Sync</h2>
            <p class="text-xs text-slate-500">Secrets supported: <code>ICS_URL_FAMILY</code>, <code>ICS_URL_NAT</code>, <code>ICS_URL_ROB</code>, <code>ICS_URL_HAMISH</code>, <code>ICS_URL_SEB</code>.</p>

      `;
    }

    function setPriv(k, v) {
      state.privacy[k] = Boolean(v);
      saveState();
      refreshEvents(true);
    }

    function esc(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function render() {
      updateClock();
      syncBadges();
      if (activeSection === "schedule") renderSchedule();
      else if (activeSection === "todo") renderTodo();
      else if (activeSection === "plans") renderPlans();
      else if (activeSection === "settings") renderSettings();
    }

    updateClock();
    setInterval(updateClock, 30000);
    render();
    refreshEvents(false);
  </script>
</body>
</html>
